# Ausbildungsportal mit Docker (Docker Compose ab Version 2.24)
#   Starten:      docker compose up -d --build
#   Logs:         docker compose logs -f app      (beim ersten Start steht hier das Startpasswort des Super-Admins)
#   Stoppen:      docker compose down             (die Daten in ./data bleiben erhalten)
#   Sicherung:    docker compose exec app npm run backup
#   Notfall:      docker compose exec app npm run admin-reset

services:
  app:
    build:
      context: .
    image: ausbildungsportal:latest
    container_name: ausbildungsportal
    restart: unless-stopped
    # Härtung: Der Prozess kann sich keine Rechte dazuholen, und der Container hat nur die Linux-Rechte, die das
    # Startskript braucht (Datenordner dem Benutzer „node“ geben, dann zu ihm wechseln). Die App läuft als „node“.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    ports:
      # Adresse und Port auf dem Server kommen aus der .env: BIND_ADRESSE und BIND_PORT.
      # Ohne Angabe: 127.0.0.1:3000 – nur auf diesem Rechner erreichbar, gedacht für einen Reverse Proxy mit HTTPS davor.
      # Rechts steht der Port im Container; er ist immer 3000.
      # Für mehr als eine Zuordnung oder ganz ohne Ports: docker-compose.override.yml (Vorlage: docker-compose.override.example.yml).
      - "${BIND_ADRESSE:-127.0.0.1}:${BIND_PORT:-3000}:3000"
    # Einstellungen aus .env (Vorlage: .env.example): BIND_ADRESSE, BIND_PORT (siehe oben), APP_URL, ENTRA_*, TRUST_PROXY, FEHLER_WEBHOOK_*, TEAMS_CHAT_WEBHOOK_URL, SMTP_*, beim ersten Start ADMIN_*.
    # Fehlt die Datei, startet die App mit Standardwerten; dann kann sich nur der Super-Admin anmelden.
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Europe/Berlin
      # im Container fest – nicht über .env ändern (Adresse und Port außen: BIND_ADRESSE und BIND_PORT, siehe oben)
      PORT: "3000"
      HOST: 0.0.0.0
      DATA_DIR: /app/data
      CONTENT_DIR: /app/content
      LERN_DIR: /app/lerninhalte
      NODE_ENV: production
    volumes:
      # Datenbank und Sicherungen – bleiben bei Updates erhalten. Gehört nie ins Git oder ins Image.
      - ./data:/app/data
      # Gepflegte Inhalte (Schulferien je Bundesland) nur lesend – Änderungen kommen ohne Neustart an
      - ./content:/app/content:ro
      # Lerninhalte (Lernmodul): ein Unterordner je Inhaltspaket, nur lesend – siehe lerninhalte/README.md
      - ./lerninhalte:/app/lerninhalte:ro
